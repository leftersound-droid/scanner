name: Self-reflexive operator validation

on:
  pull_request:
    paths:
      - 'src/scanner/self_reflexive_operator.py'
      - 'tests/test_self_reflexive_operator.py'
      - '.github/workflows/self-reflexive-operator.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and pytest
        run: python -m pip install -e . pytest
      - name: Run operator tests
        run: python -m pytest -q tests/test_self_reflexive_operator.py
