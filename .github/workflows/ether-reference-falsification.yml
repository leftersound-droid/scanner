name: Ether reference falsification

on:
  pull_request:
    paths:
      - 'experiments/cross_domain/ether_reference_falsification/**'
      - 'src/scanner/self_reflexive_operator.py'
      - '.github/workflows/ether-reference-falsification.yml'
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run ether reference falsification control
        run: python experiments/cross_domain/ether_reference_falsification/run.py
      - name: Upload full raw journal
        uses: actions/upload-artifact@v4
        with:
          name: ether-reference-falsification-journal
          path: run-data/cross_domain/ether_reference_falsification/
          compression-level: 6
