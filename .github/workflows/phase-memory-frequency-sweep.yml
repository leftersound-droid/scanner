name: Phase memory frequency sweep

on:
  push:
    branches: [agent/scanner-v2-beta]
    paths:
      - 'experiments/cross_domain/phase_memory_frequency_sweep/**'
      - '.github/workflows/phase-memory-frequency-sweep.yml'
      - 'src/scanner/self_reflexive_operator.py'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run local-field / phase-frequency sweep
        run: python experiments/cross_domain/phase_memory_frequency_sweep/run.py
      - name: Upload complete journal
        uses: actions/upload-artifact@v4
        with:
          name: phase-memory-frequency-sweep-journal
          path: run-data/cross_domain/phase_memory_frequency_sweep/
          compression-level: 6
