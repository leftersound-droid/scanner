name: R4 pulse rotation free release

on:
  push:
    branches: [agent/scanner-v2-beta]
    paths:
      - 'experiments/cross_domain/r4_pulse_rotation_free_release/**'
      - '.github/workflows/r4-pulse-rotation-free-release.yml'
      - 'src/scanner/self_reflexive_operator.py'
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run R4-pulse rotation free-release experiment
        run: python experiments/cross_domain/r4_pulse_rotation_free_release/run.py
      - name: Upload full raw journal
        uses: actions/upload-artifact@v4
        with:
          name: r4-pulse-rotation-free-release-journal
          path: run-data/cross_domain/r4_pulse_rotation_free_release/
