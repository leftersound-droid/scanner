name: Field inertia charge separation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cross_domain/field_inertia_charge_separation/**'
      - '.github/workflows/field-inertia-charge-separation.yml'

jobs:
  separation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 2x2 separation benchmark
        run: python experiments/cross_domain/field_inertia_charge_separation/run.py
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-inertia-charge-separation-result
          path: run-data/cross_domain/field_inertia_charge_separation/result.json
          if-no-files-found: error
