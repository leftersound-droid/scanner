name: Phase memory m3 m4 wave modes

on:
  pull_request:
    paths:
      - 'experiments/cross_domain/phase_memory_wave_modes/**'
      - 'src/scanner/self_reflexive_operator.py'
      - '.github/workflows/phase-memory-wave-modes.yml'
  workflow_dispatch:

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Run m3/m4 phase-memory wave test
        run: python experiments/cross_domain/phase_memory_wave_modes/run.py
      - name: Upload full measurement journal
        uses: actions/upload-artifact@v4
        with:
          name: phase-memory-wave-modes-journal
          path: run-data/cross_domain/phase_memory_wave_modes/
          compression-level: 6
