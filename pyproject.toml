[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recursive-scanner"
version = "0.2.0b1"
description = "Two-layer recursive research scanner with relational and strategy memory"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
